services:
  etcd:
    image: gcr.io/etcd-development/etcd:v3.5.16
    container_name: etcd-local
    ports:
      - "2379:2379"
    command:
      - etcd
      - --name
      - etcd-local
      - --listen-client-urls
      - http://0.0.0.0:2379
      - --advertise-client-urls
      - http://localhost:2379
      - --initial-cluster-state
      - new

