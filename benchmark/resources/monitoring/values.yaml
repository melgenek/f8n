grafana:
  enabled: true
  defaultDashboardsEnabled: true

  sidecar:
    skipTlsVerify: true
    dashboards:
      enabled: true
      # This label must match what kube-prometheus-stack uses internally
      label: grafana_dashboard
      searchNamespace: ALL
      folder: /var/lib/grafana/dashboards
    datasources:
      enabled: true

  tolerations: []

prometheus:
  prometheusSpec:
    tolerations: []

alertmanager:
  enabled: false
